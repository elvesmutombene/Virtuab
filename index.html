
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infropay | MEGA Storage Test</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 25px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 460px;
      margin: 40px auto;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #6edc82;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .panel {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #bbb;
      margin-bottom: 9px;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px;
      background: #090909;
      border: 1px solid #333;
      border-radius: 9px;
      color: white;
      margin-bottom: 22px;
      outline: none;
    }

    .file-area {
      border: 1px dashed #555;
      background: #0d0d0d;
      border-radius: 12px;
      padding: 25px 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .file-area p {
      color: #aaa;
      font-size: 13px;
      margin: 8px 0;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 12px;
      color: #aaa;
      font-size: 12px;
    }

    button {
      width: 100%;
      background: #6edc82;
      border: none;
      padding: 15px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: #07100a;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 18px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .result {
      margin-top: 15px;
      padding: 14px;
      background: #0c1c10;
      border: 1px solid #245b31;
      border-radius: 10px;
      display: none;
    }

    .result a {
      display: block;
      color: #6edc82;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .note {
      color: #777;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">INFRO<span>PAY</span></div>
    <p class="subtitle">MEGA Storage Test · Upload de ficheiros</p>

    <section class="panel">

      <label for="accessKey">Chave de acesso ao teste</label>
      <input
        type="password"
        id="accessKey"
        placeholder="Introduz a chave de teste"
      >

      <div class="file-area">
        <div style="font-size:35px">☁️</div>
        <strong>Selecionar ficheiro</strong>
        <p>PDF, JPG, PNG ou WEBP</p>

        <input
          type="file"
          id="file"
          accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp"
        >
      </div>

      <button id="uploadBtn" onclick="sendFile()">
        Enviar para o MEGA
      </button>

      <div id="status"></div>

      <div class="result" id="result">
        <strong>Upload concluído!</strong>
        <p id="fileName"></p>
        <a id="fileLink" target="_blank" rel="noopener noreferrer">
          Abrir ficheiro no MEGA
        </a>
      </div>

      <p class="note">
        Teste limitado a 3 MB por ficheiro.
        Os links gerados são links públicos de partilha.
        Não utilizes documentos confidenciais.
      </p>

    </section>

  </main>

<script>
async function sendFile() {
  const fileInput = document.getElementById("file");
  const key = document.getElementById("accessKey").value;
  const status = document.getElementById("status");
  const button = document.getElementById("uploadBtn");
  const result = document.getElementById("result");

  result.style.display = "none";

  if (!key) {
    status.textContent = "Introduz a chave de acesso.";
    return;
  }

  if (!fileInput.files.length) {
    status.textContent = "Seleciona primeiro um ficheiro.";
    return;
  }

  const file = fileInput.files[0];

  if (file.size > 3 * 1024 * 1024) {
    status.textContent = "O ficheiro não pode ultrapassar 3 MB.";
    return;
  }

  button.disabled = true;
  button.textContent = "A enviar...";
  status.textContent = "A preparar o envio para o MEGA...";

  try {
    const formData = new FormData();
    formData.append("file", file);

    const response = await fetch("/api/upload", {
      method: "POST",
      headers: {
        "x-test-key": key
      },
      body: formData
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Erro no envio.");
    }

    status.textContent =
      "Ficheiro enviado com sucesso!";

    document.getElementById("fileName").textContent =
      data.filename;

    document.getElementById("fileLink").href =
      data.link;

    document.getElementById("fileLink").textContent =
      data.link;

    result.style.display = "block";

  } catch (error) {
    status.textContent = "Erro: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Enviar para o MEGA";
  }
}
</script>

</body>
</html>
